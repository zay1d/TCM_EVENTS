# nginx reverse proxy for the TCM Events API.
# Put this in /etc/nginx/sites-available/tcm-events and symlink into sites-enabled.
# Replace api.example.com with your domain, then run certbot for TLS:
#   sudo certbot --nginx -d api.example.com

server {
    server_name api.example.com;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    # After running certbot, it will add the listen 443 ssl block and certificate paths here.
}
